<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de correo — CMV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f172a;
    --panel-1: #161f34;
    --panel-2: #1c2842;
    --text: #f8fafc;
    --text-2: #cbd5e1;
    --text-3: #94a3b8;
    --border-1: rgba(255,255,255,0.16);
    --border-2: rgba(255,255,255,0.09);
    --green: #00c06b;
    --gold: #f5c518;
    --error: #e63329;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(0,192,107,0.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 64px);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    background: var(--panel-1);
    border: 1px solid var(--border-1);
    border-radius: 18px;
    padding: 36px 28px 32px;
    text-align: center;
  }

  .brand-icon{
    font-size: 40px;
    line-height: 1;
    margin-bottom: 10px;
  }

  .status-icon{
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 18px;
  }

  .status-icon.ok{ background: rgba(0,192,107,0.14); color: var(--green); }
  .status-icon.error{ background: rgba(230,51,41,0.14); color: var(--error); }

  h1{
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  p.lead{
    font-size: 15px;
    color: var(--text-2);
    line-height: 1.5;
    margin: 0 0 26px;
  }

  a.btn{
    display: inline-block;
    background: var(--green);
    color: #06251a;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 12px;
    transition: filter 0.15s ease;
  }

  a.btn:hover{ filter: brightness(1.08); }

  .footer-note{
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-3);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">🏈</div>
    <div class="status-icon" id="statusIcon"></div>
    <h1 id="titulo">Verificando...</h1>
    <p class="lead" id="mensaje">Un momento.</p>
    <a class="btn" href="index.html">Ir a Quiniela CMV</a>
    <p class="footer-note" id="footerNote"></p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var ok = params.get('ok');
    var error = params.get('error');

    var iconoEl = document.getElementById('statusIcon');
    var tituloEl = document.getElementById('titulo');
    var mensajeEl = document.getElementById('mensaje');
    var footerEl = document.getElementById('footerNote');

    var mensajesError = {
      faltante: 'El link no incluye la información necesaria para verificar tu cuenta.',
      invalido: 'Este link ya no es válido. Puede que ya lo hayas usado antes.',
      expirado: 'Este link de verificación expiró. Vuelve a registrarte para recibir uno nuevo.',
      servidor: 'Ocurrió un error de nuestro lado al verificar tu cuenta. Intenta de nuevo en unos minutos.'
    };

    if (ok === '1') {
      iconoEl.classList.add('ok');
      iconoEl.textContent = '✓';
      tituloEl.textContent = 'Cuenta verificada';
      mensajeEl.textContent = 'Tu correo quedó confirmado. Ya puedes iniciar sesión en Quiniela CMV con tu correo y contraseña.';
    } else {
      iconoEl.classList.add('error');
      iconoEl.textContent = '!';
      tituloEl.textContent = 'No pudimos verificar tu cuenta';
      mensajeEl.textContent = mensajesError[error] ||
        'No pudimos confirmar tu cuenta. Intenta registrarte de nuevo.';
      footerEl.textContent = '¿Sigue sin funcionar? Responde el correo de confirmación y te ayudamos.';
    }
  </script>
</body>
</html>
