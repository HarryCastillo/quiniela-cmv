<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops — Quiniela NFL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0d0d; --panel-1: #161616; --panel-2: #1a1a1a;
    --text: #f0f0f0; --text-2: #aaa; --text-3: #888;
    --border-1: #444; --border-2: #333;
    --green: #00c06b; --green-dark: #009952; --green-light: #48c78e;
    --gold: #f5c518; --error: #e63329;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: 'Work Sans', sans-serif; padding: 24px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; }
  .eyebrow{
    font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--green); margin: 0 0 6px;
  }
  h1{
    font-family: 'Anton', sans-serif; font-weight: 400; font-size: 32px;
    text-transform: uppercase; margin: 0 0 24px; letter-spacing: 0.01em;
  }
  h2{
    font-family: 'Anton', sans-serif; font-weight: 400; font-size: 18px;
    text-transform: uppercase; margin: 0 0 14px; color: var(--text);
  }
  .card{
    background: var(--panel-1); border: 1px solid var(--border-2);
    border-radius: 12px; padding: 22px; margin-bottom: 18px;
  }
  .campo{ margin-bottom: 14px; }
  .campo label{
    display: block; font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
    margin-bottom: 6px;
  }
  .campo input, .campo select{
    width: 100%; background: var(--panel-2); border: 1px solid var(--border-1);
    color: var(--text); font-family: 'Work Sans', sans-serif; font-size: 15px;
    padding: 10px 12px; border-radius: 8px; outline: none;
  }
  .campo input:focus, .campo select:focus{ border-color: var(--green); }
  .btn{
    font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.05em;
    text-transform: uppercase; border: none; border-radius: 8px; padding: 12px 20px;
    cursor: pointer; transition: opacity 0.15s ease;
  }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; }
  .btn-verde{ background: var(--green); color: var(--bg); font-weight: 700; }
  .btn-verde:hover:not(:disabled){ background: var(--green-dark); }
  .btn-dorado{ background: var(--gold); color: var(--bg); font-weight: 700; }
  .btn-dorado:hover:not(:disabled){ opacity: 0.85; }
  .btn-fantasma{
    background: transparent; color: var(--text-2); border: 1px solid var(--border-1);
  }
  .btn-fantasma:hover:not(:disabled){ color: var(--text); border-color: var(--text-2); }

  /* ── Resultados pendientes (casillas + aplicar en lote) ── */
  .sugerencias-wrap{ display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .sugerencia-item{
    display: flex; align-items: center; gap: 14px;
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 8px;
    padding: 12px 14px; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sugerencia-item.marcado{ border-color: var(--green); background: rgba(0,192,107,0.06); }
  .sugerencia-info{ flex: 1; min-width: 0; }
  .partido-meta{ font-size: 11px; color: var(--text-3); font-family: 'Space Mono', monospace; margin-bottom: 4px; }
  .equipo-fila{
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 14px; font-weight: 600; margin-top: 4px;
  }
  .equipo-fila .pts{ font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; color: var(--green-light); }
  .equipo-fila .rol{ font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 400; color: var(--text-3); text-transform: uppercase; margin-right: 6px; }
  .chk-resultado{ width: 28px; height: 28px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .zona-aplicar{ margin-top: 6px; }

  .mensaje{
    font-family: 'Space Mono', monospace; font-size: 13px; padding: 10px 14px;
    border-radius: 8px; margin-top: 10px; display: none; white-space: pre-line;
  }
  .mensaje.error{ display: block; background: rgba(230,51,41,0.1); border: 1px solid var(--error); color: #ff8079; }
  .mensaje.exito{ display: block; background: rgba(0,192,107,0.1); border: 1px solid var(--green); color: var(--green-light); }

  .banner-sin-pago{
    background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.35);
    border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; font-size: 13px;
    color: var(--gold);
  }

  .oculto{ display: none !important; }
  .empty-state{ text-align: center; padding: 32px 16px; color: var(--text-3); font-size: 13px; }
  .loading{ text-align: center; padding: 24px 0; color: var(--text-3); font-size: 13px; }

  /* ── Pestañas ── */
  .admin-tabs{ display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border-2); }
  .admin-tab{
    padding: 10px 16px; font-size: 13px; font-weight: 500; color: var(--text-3);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s ease;
  }
  .admin-tab:hover{ color: var(--text); }
  .admin-tab.active{ color: var(--green-light); border-bottom-color: var(--green); }
  .admin-sec{ display: none; }
  .admin-sec.visible{ display: block; }

  /* ── Participantes ── */
  .search-bar input{
    width: 100%; background: var(--panel-2); border: 1px solid var(--border-1);
    color: var(--text); font-family: 'Work Sans', sans-serif; font-size: 14px;
    padding: 10px 14px; border-radius: 8px; outline: none; margin-bottom: 10px;
  }
  .search-bar input:focus{ border-color: var(--green); }
  .filtro-tabs{ display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filtro-tab{
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border-1);
    background: transparent; color: var(--text-3); font-size: 12px; cursor: pointer;
  }
  .filtro-tab.active{ background: var(--green); color: var(--bg); border-color: var(--green); font-weight: 700; }
  .part-fila{
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .part-top{ display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .part-nombre{ font-weight: 600; font-size: 14px; }
  .part-meta{ font-size: 11px; color: var(--text-3); font-family: 'Space Mono', monospace; margin-top: 2px; }
  .badge-pago{ padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-pago.pagado{ background: rgba(0,192,107,0.15); color: var(--green-light); border: 1px solid rgba(0,192,107,0.3); }
  .badge-pago.pendiente{ background: rgba(245,197,24,0.1); color: var(--gold); border: 1px solid rgba(245,197,24,0.3); }
  .part-acciones{ display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .btn-mini{
    background: transparent; border: 1px solid var(--border-1); border-radius: 6px;
    padding: 5px 10px; font-size: 11px; color: var(--text-2); cursor: pointer;
  }
  .btn-mini:hover{ border-color: var(--green); color: var(--green-light); }
  .btn-mini.danger:hover{ border-color: var(--error); color: #ff8079; }

  /* ── Modales ── */
  .modal-overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex;
    align-items: center; justify-content: center; z-index: 500; opacity: 0;
    pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.visible{ opacity: 1; pointer-events: all; }
  .modal{
    background: var(--panel-1); border: 1px solid var(--border-2); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 380px; margin: 16px;
  }
  .modal h3{ font-family: 'Anton', sans-serif; font-weight: 400; font-size: 18px; margin-bottom: 8px; text-transform: uppercase; }
  .modal p{ font-size: 13px; color: var(--text-2); margin-bottom: 16px; line-height: 1.5; }
  .modal input{
    width: 100%; background: var(--panel-2); border: 1px solid var(--border-1);
    color: var(--text); font-size: 14px; padding: 10px 12px; border-radius: 8px;
    outline: none; margin-bottom: 14px;
  }
  .modal-btns{ display: flex; gap: 8px; }
  .modal-btns .btn{ flex: 1; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--panel-2); border: 1px solid var(--border-1); border-radius: 8px;
    padding: 11px 18px; font-size: 13px; transition: transform 0.3s ease; z-index: 999;
  }
  .toast.visible{ transform: translateX(-50%) translateY(0); }
  .toast.ok{ border-color: var(--green); color: var(--green-light); }
  .toast.err{ border-color: var(--error); color: #ff8079; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrowTenant">Panel interno</p>
  <h1>Capturar resultados</h1>

  <!-- Compuerta de acceso -->
  <div class="card" id="card-acceso">
    <h2>Acceso</h2>
    <div class="campo">
      <label>Secreto de admin</label>
      <input type="password" id="adminSecret" placeholder="ADMIN_SECRET_MASTER" autocomplete="off">
    </div>
    <button class="btn btn-verde" id="btnEntrar">Entrar</button>
    <div class="mensaje" id="mensajeAcceso"></div>
  </div>

  <!-- Panel principal -->
  <div id="panelPrincipal" class="oculto">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <span style="opacity:.65;font-size:13px">Tenant activo: <strong id="tenantActual"></strong> · Versión <strong id="versionOps"></strong></span>
      <button class="btn btn-fantasma" id="btnSalir">Salir</button>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="resultados">Resultados</div>
      <div class="admin-tab" data-tab="participantes">Participantes</div>
    </div>

    <div id="sec-resultados" class="admin-sec visible">

    <div class="card">
      <h2>Resultados pendientes</h2>
      <button class="btn btn-fantasma" id="btnBuscarMarcadores">Buscar resultados pendientes</button>
      <div class="mensaje" id="mensajeLote"></div>
      <div id="sugerenciasMarcadores"></div>
      <div class="zona-aplicar oculto" id="zonaAplicar">
        <button class="btn btn-dorado" id="btnAplicarLote" disabled>Aplicar marcados (0)</button>
      </div>
    </div>

    </div><!-- /sec-resultados -->

    <div id="sec-participantes" class="admin-sec">
      <div class="card">
        <div id="bannerSinPago" style="display:none"></div>
        <div class="search-bar">
          <input type="text" id="busquedaParticipantes" placeholder="Buscar por nombre, correo o username...">
        </div>
        <div class="filtro-tabs">
          <button class="filtro-tab active" data-filtro="todos">Todos</button>
          <button class="filtro-tab" data-filtro="pagados">Pagados</button>
          <button class="filtro-tab" data-filtro="pendientes">Pendientes</button>
        </div>
        <div id="listaParticipantes"><div class="loading">Cargando participantes...</div></div>
      </div>
    </div>

  </div>
</div>

<!-- Modal: editar nombre -->
<div class="modal-overlay" id="modalNombre">
  <div class="modal">
    <h3>Editar nombre</h3>
    <p id="modalNombreDesc"></p>
    <input type="text" id="modalNombreInput" placeholder="Nombre completo">
    <div class="modal-btns">
      <button class="btn btn-fantasma" id="btnCancelarNombre">Cancelar</button>
      <button class="btn btn-verde" id="btnGuardarNombre">Guardar</button>
    </div>
    <div class="mensaje" id="mensajeModalNombre"></div>
  </div>
</div>

<!-- Modal: cambiar password -->
<div class="modal-overlay" id="modalPassword">
  <div class="modal">
    <h3>Cambiar password</h3>
    <p id="modalPasswordDesc"></p>
    <input type="text" id="modalPasswordInput" placeholder="Nuevo password (mín. 8 caracteres)">
    <div class="modal-btns">
      <button class="btn btn-fantasma" id="btnCancelarPassword">Cancelar</button>
      <button class="btn btn-verde" id="btnGuardarPassword">Guardar</button>
    </div>
    <div class="mensaje" id="mensajeModalPassword"></div>
  </div>
</div>

<!-- Modal: borrar participante -->
<div class="modal-overlay" id="modalBorrar">
  <div class="modal">
    <h3>Borrar participante</h3>
    <p id="modalBorrarDesc"></p>
    <div class="modal-btns">
      <button class="btn btn-fantasma" id="btnCancelarBorrar">Cancelar</button>
      <button class="btn btn-dorado" id="btnConfirmarBorrar" style="background:var(--error);color:#fff">Sí, borrar</button>
    </div>
    <div class="mensaje" id="mensajeModalBorrar"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // Versión del panel: se cambia en cada entrega (fecha + letra) para
  // poder identificar de un vistazo qué archivo está publicado.
  var VERSION_OPS = 'v2026-11-06a';

  // --- Rellenar con las URLs reales despues de desplegar cada función ---
  // Tenant por hash de URL (#cmv, #demo, etc), mismo patrón que
  // index.html. Sin hash, cae en "cmv" (cliente real en producción) para
  // no operar por accidente sobre el tenant de pruebas "dabo".
  var SLUG_TENANT = (window.location.hash || '').replace('#', '').trim() || 'cmv';
  document.title = 'Ops — ' + SLUG_TENANT;
  document.getElementById('eyebrowTenant').textContent =
    SLUG_TENANT.toUpperCase() + ' · Panel interno · ' + VERSION_OPS;
  document.getElementById('versionOps').textContent = VERSION_OPS;
  var BASE_URL = 'https://us-central1-quiniela-futbol-americano.cloudfunctions.net/';
  var URL_SUGERIR = BASE_URL + 'sugerirResultadosNFL';
  var URL_LOTE = BASE_URL + 'confirmarResultadosLoteNFL';
  var URL_ADMIN_PARTICIPANTES = BASE_URL + 'adminParticipantesNFL';
  var URL_ADMIN_PAGO = BASE_URL + 'adminPagoNFL';
  var URL_ADMIN_NOMBRE = BASE_URL + 'adminNombreNFL';
  var URL_ADMIN_PASSWORD = BASE_URL + 'adminPasswordNFL';
  var URL_ADMIN_BORRAR = BASE_URL + 'adminBorrarNFL';
  var CLAVE_SESION = 'ops_dabo_admin_secret';

  var adminSecret = sessionStorage.getItem(CLAVE_SESION) || '';
  var sugerenciasActuales = []; // ultimos resultados encontrados en ESPN
  var aplicando = false;

  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function mostrarMensaje(id, texto, tipo){
    var el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'mensaje ' + tipo;
  }
  function limpiarMensaje(id){
    var el = document.getElementById(id);
    el.textContent = ''; el.className = 'mensaje';
  }

  if (adminSecret) mostrarPanelPrincipal();

  document.getElementById('btnEntrar').addEventListener('click', function(){
    var valor = document.getElementById('adminSecret').value.trim();
    if (!valor){ mostrarMensaje('mensajeAcceso', 'Ingresa el secreto', 'error'); return; }
    adminSecret = valor;
    sessionStorage.setItem(CLAVE_SESION, adminSecret);
    mostrarPanelPrincipal();
  });

  document.getElementById('btnSalir').addEventListener('click', function(){
    sessionStorage.removeItem(CLAVE_SESION);
    adminSecret = '';
    sugerenciasActuales = [];
    renderSugerencias(false);
    limpiarMensaje('mensajeLote');
    document.getElementById('adminSecret').value = '';
    document.getElementById('panelPrincipal').classList.add('oculto');
    document.getElementById('card-acceso').classList.remove('oculto');
    mostrarMensaje('mensajeAcceso', '', '');
  });

  function mostrarPanelPrincipal(){
    document.getElementById('tenantActual').textContent = SLUG_TENANT;
    document.getElementById('card-acceso').classList.add('oculto');
    document.getElementById('panelPrincipal').classList.remove('oculto');
  }

  // --- Navegación de pestañas ---
  var participantesCargados = false;
  document.querySelectorAll('.admin-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.admin-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      document.querySelectorAll('.admin-sec').forEach(function(s){ s.classList.remove('visible'); });
      document.getElementById('sec-' + tab.dataset.tab).classList.add('visible');
      if (tab.dataset.tab === 'participantes' && !participantesCargados){
        participantesCargados = true;
        cargarParticipantes();
      }
    });
  });

  function toast(msg, tipo){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible ' + (tipo || '');
    setTimeout(function(){ t.className = 'toast'; }, 3000);
  }

  function manejarNoAutorizado(data){
    if (data && String(data.error || '').indexOf('autorizado') !== -1){
      sessionStorage.removeItem(CLAVE_SESION);
      document.getElementById('panelPrincipal').classList.add('oculto');
      document.getElementById('card-acceso').classList.remove('oculto');
      mostrarMensaje('mensajeAcceso', 'Secreto incorrecto. Vuelve a entrar.', 'error');
      return true;
    }
    return false;
  }

  // =====================================================================
  // Pestaña Resultados: buscar, marcar y aplicar en lote
  // =====================================================================

  // Actualiza el contador y el estado del botón "Aplicar marcados" según
  // las casillas marcadas, y resalta las filas marcadas.
  function actualizarBotonAplicar(){
    var cont = document.getElementById('sugerenciasMarcadores');
    var marcadas = 0;
    cont.querySelectorAll('.sugerencia-item').forEach(function(item){
      var chk = item.querySelector('.chk-resultado');
      if (chk.checked){ marcadas++; item.classList.add('marcado'); }
      else { item.classList.remove('marcado'); }
    });
    var btn = document.getElementById('btnAplicarLote');
    btn.textContent = aplicando ? 'Aplicando...' : 'Aplicar marcados (' + marcadas + ')';
    btn.disabled = aplicando || marcadas === 0;
  }

  // Pinta las filas de resultados encontrados, cada una con su casilla
  // (siempre desmarcada al pintar) y el botón de aplicar al final.
  // @param {boolean} mostrarVacio Si true y no hay resultados, pinta el
  //   mensaje "sin resultados nuevos".
  function renderSugerencias(mostrarVacio){
    var cont = document.getElementById('sugerenciasMarcadores');
    var zona = document.getElementById('zonaAplicar');

    if (!sugerenciasActuales.length){
      cont.innerHTML = mostrarVacio ?
        '<div class="empty-state">Sin resultados nuevos por ahora.</div>' : '';
      zona.classList.add('oculto');
      return;
    }

    cont.innerHTML = '<div class="sugerencias-wrap">' + sugerenciasActuales.map(function(s){
      // Mismo criterio que index.html: temporada regular muestra
      // "Semana N"; playoffs (sin jornada) muestran la fase. Si el
      // backend aun no manda jornada, cae a la fase.
      var faseTexto = s.jornada ? 'Semana ' + s.jornada : s.fase;
      return '<div class="sugerencia-item" data-id="' + esc(s.partidoId) + '">' +
        '<div class="sugerencia-info">' +
          '<div class="partido-meta">' + esc(faseTexto) + '</div>' +
          '<div class="equipo-fila"><span><span class="rol">Visitante</span>' + esc(s.visitante) + '</span>' +
            '<span class="pts">' + esc(s.golesVisitante) + '</span></div>' +
          '<div class="equipo-fila"><span><span class="rol">Local</span>' + esc(s.local) + '</span>' +
            '<span class="pts">' + esc(s.golesLocal) + '</span></div>' +
        '</div>' +
        '<input type="checkbox" class="chk-resultado" aria-label="De acuerdo con este marcador">' +
      '</div>';
    }).join('') + '</div>';

    cont.querySelectorAll('.chk-resultado').forEach(function(chk){
      chk.addEventListener('change', actualizarBotonAplicar);
    });
    zona.classList.remove('oculto');
    actualizarBotonAplicar();
  }

  // Consulta ESPN (via sugerirResultadosNFL) y pinta los resultados.
  // @param {boolean} conservarMensaje Si true, no borra el resumen de la
  //   última aplicación (se usa al refrescar la lista tras aplicar).
  function buscarResultados(conservarMensaje){
    var btn = document.getElementById('btnBuscarMarcadores');
    var cont = document.getElementById('sugerenciasMarcadores');
    btn.disabled = true; btn.textContent = 'Buscando...';
    if (!conservarMensaje) limpiarMensaje('mensajeLote');
    document.getElementById('zonaAplicar').classList.add('oculto');
    cont.innerHTML = '<div class="loading">Consultando ESPN...</div>';

    fetch(URL_SUGERIR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({adminSecret: adminSecret, slug: SLUG_TENANT})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        btn.disabled = false; btn.textContent = 'Buscar resultados pendientes';
        if (manejarNoAutorizado(data)){ cont.innerHTML = ''; return; }
        if (!data.ok){ cont.innerHTML = ''; toast(data.error || 'Error al buscar resultados', 'err'); return; }
        sugerenciasActuales = data.sugerencias || [];
        renderSugerencias(true);
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Buscar resultados pendientes';
        cont.innerHTML = '';
        toast('Error de conexión', 'err');
      });
  }

  document.getElementById('btnBuscarMarcadores').addEventListener('click', function(){
    buscarResultados(false);
  });

  // Aplica en lote SOLO los resultados con la casilla marcada. Sin
  // segunda confirmación: marcar la casilla es la validación.
  document.getElementById('btnAplicarLote').addEventListener('click', function(){
    if (aplicando) return;
    var cont = document.getElementById('sugerenciasMarcadores');
    var seleccion = [];
    var nombres = {};
    cont.querySelectorAll('.sugerencia-item').forEach(function(item){
      if (!item.querySelector('.chk-resultado').checked) return;
      var id = item.dataset.id;
      var s = sugerenciasActuales.find(function(x){ return x.partidoId === id; });
      if (!s) return;
      nombres[id] = s.visitante + ' @ ' + s.local;
      seleccion.push({partidoId: s.partidoId, golesLocal: s.golesLocal, golesVisitante: s.golesVisitante});
    });
    if (!seleccion.length) return;

    aplicando = true;
    actualizarBotonAplicar();
    limpiarMensaje('mensajeLote');

    fetch(URL_LOTE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({adminSecret: adminSecret, slug: SLUG_TENANT, resultados: seleccion})
    })
      .then(function(r){ return r.json(); })
      .then(function(data){
        aplicando = false;
        if (manejarNoAutorizado(data)){ return; }
        if (!data.ok){
          mostrarMensaje('mensajeLote', data.error || 'Error al aplicar', 'error');
          actualizarBotonAplicar();
          return;
        }
        var lineas = ['Aplicados: ' + data.aplicados + ' de ' + seleccion.length + '.'];
        if (data.yaAplicados) lineas.push('Ya estaban aplicados: ' + data.yaAplicados + '.');
        (data.detalle || []).forEach(function(d){
          if (d.estado === 'error'){
            lineas.push('✗ ' + (nombres[d.partidoId] || d.partidoId) + ': ' + d.mensaje);
          }
        });
        mostrarMensaje('mensajeLote', lineas.join('\n'), data.errores ? 'error' : 'exito');
        buscarResultados(true);
      })
      .catch(function(){
        aplicando = false;
        actualizarBotonAplicar();
        mostrarMensaje('mensajeLote', 'Error de conexión. Antes de reintentar, busca de nuevo para ver qué se alcanzó a aplicar.', 'error');
      });
  });

  // =====================================================================
  // Pestaña Participantes
  // =====================================================================
  var participantes = [];
  var filtroPagoActivo = 'todos';
  var idModalActivo = null;

  function apiPostAdmin(url, extra){
    var body = Object.assign({adminSecret: adminSecret, slug: SLUG_TENANT}, extra);
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    })
      .then(function(r){ return r.json(); });
  }

  function cargarParticipantes(){
    var cont = document.getElementById('listaParticipantes');
    cont.innerHTML = '<div class="loading">Cargando participantes...</div>';
    apiPostAdmin(URL_ADMIN_PARTICIPANTES).then(function(data){
      if (manejarNoAutorizado(data)) return;
      if (!data.ok){ cont.innerHTML = '<div class="empty-state">Error al cargar participantes.</div>'; return; }
      participantes = data.participantes || [];
      var banner = document.getElementById('bannerSinPago');
      if (data.requierePago === false){
        banner.textContent = '💡 Este tenant no requiere pago — el estado de pago de cada participante no bloquea nada.';
        banner.className = 'banner-sin-pago';
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }
      renderParticipantes();
    }).catch(function(){
      cont.innerHTML = '<div class="empty-state">No se pudo conectar con el servidor.</div>';
    });
  }

  function renderParticipantes(){
    var cont = document.getElementById('listaParticipantes');
    var busq = document.getElementById('busquedaParticipantes').value.toLowerCase();
    var lista = participantes;
    if (filtroPagoActivo === 'pagados') lista = lista.filter(function(p){ return p.estadoPago === 'pagado'; });
    if (filtroPagoActivo === 'pendientes') lista = lista.filter(function(p){ return p.estadoPago === 'pendiente'; });
    if (busq){
      lista = lista.filter(function(p){
        return (p.nombre || '').toLowerCase().indexOf(busq) !== -1 ||
          (p.correo || '').toLowerCase().indexOf(busq) !== -1 ||
          (p.username || '').toLowerCase().indexOf(busq) !== -1;
      });
    }
    if (!lista.length){
      cont.innerHTML = '<div class="empty-state">Sin resultados.</div>';
      return;
    }
    cont.innerHTML = lista.map(function(p){
      var pagado = p.estadoPago === 'pagado';
      var badge = pagado
        ? '<span class="badge-pago pagado">Pagado</span>'
        : '<span class="badge-pago pendiente">' + (p.estadoPago === 'deshabilitado' ? 'Deshabilitado' : 'Pendiente') + '</span>';
      return '<div class="part-fila" data-id="' + p.id + '">' +
        '<div class="part-top">' +
          '<div>' +
            '<div class="part-nombre">' + (p.nombre || '—') + '</div>' +
            '<div class="part-meta">@' + p.username + (p.correo ? ' · ' + p.correo : '') + '</div>' +
            '<div class="part-meta">' + p.puntos + ' pts · ' + p.correctos + ' correctos</div>' +
          '</div>' +
          badge +
        '</div>' +
        '<div class="part-acciones">' +
          '<button class="btn-mini btn-toggle-pago">' + (pagado ? 'Marcar pendiente' : 'Confirmar pago') + '</button>' +
          '<button class="btn-mini btn-editar-nombre">Editar nombre</button>' +
          '<button class="btn-mini btn-cambiar-password">Password</button>' +
          '<button class="btn-mini danger btn-borrar">Borrar</button>' +
        '</div>' +
      '</div>';
    }).join('');

    cont.querySelectorAll('.part-fila').forEach(function(fila){
      var id = fila.dataset.id;
      var p = participantes.find(function(x){ return x.id === id; });
      fila.querySelector('.btn-toggle-pago').addEventListener('click', function(){ togglePago(p, this); });
      fila.querySelector('.btn-editar-nombre').addEventListener('click', function(){ abrirModalNombre(p); });
      fila.querySelector('.btn-cambiar-password').addEventListener('click', function(){ abrirModalPassword(p); });
      fila.querySelector('.btn-borrar').addEventListener('click', function(){ abrirModalBorrar(p); });
    });
  }

  document.getElementById('busquedaParticipantes').addEventListener('input', renderParticipantes);
  document.querySelectorAll('#sec-participantes .filtro-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#sec-participantes .filtro-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      filtroPagoActivo = btn.dataset.filtro;
      renderParticipantes();
    });
  });

  function togglePago(p, btn){
    var nuevoPagado = p.estadoPago !== 'pagado';
    btn.disabled = true; btn.textContent = '...';
    apiPostAdmin(URL_ADMIN_PAGO, {id: p.id, pagado: nuevoPagado}).then(function(data){
      if (manejarNoAutorizado(data)) return;
      if (!data.ok){ toast(data.error || 'Error al actualizar pago', 'err'); btn.disabled = false; return; }
      p.estadoPago = nuevoPagado ? 'pagado' : 'pendiente';
      renderParticipantes();
      toast(nuevoPagado ? 'Pago confirmado' : 'Pago desconfirmado', 'ok');
    }).catch(function(){ toast('Error de conexión', 'err'); btn.disabled = false; });
  }

  function abrirModalNombre(p){
    idModalActivo = p.id;
    document.getElementById('modalNombreDesc').textContent = 'Editando: ' + p.nombre;
    document.getElementById('modalNombreInput').value = p.nombre || '';
    document.getElementById('modalNombre').classList.add('visible');
  }
  document.getElementById('btnCancelarNombre').addEventListener('click', function(){
    document.getElementById('modalNombre').classList.remove('visible');
  });
  document.getElementById('btnGuardarNombre').addEventListener('click', function(){
    var nuevoNombre = document.getElementById('modalNombreInput').value.trim();
    if (!nuevoNombre){ mostrarMensaje('mensajeModalNombre', 'El nombre no puede estar vacío', 'error'); return; }
    apiPostAdmin(URL_ADMIN_NOMBRE, {id: idModalActivo, nombre: nuevoNombre}).then(function(data){
      if (manejarNoAutorizado(data)) return;
      if (!data.ok){ mostrarMensaje('mensajeModalNombre', data.error || 'Error', 'error'); return; }
      var p = participantes.find(function(x){ return x.id === idModalActivo; });
      if (p) p.nombre = data.nombre;
      document.getElementById('modalNombre').classList.remove('visible');
      limpiarMensaje('mensajeModalNombre');
      renderParticipantes();
      toast('Nombre actualizado', 'ok');
    }).catch(function(){ mostrarMensaje('mensajeModalNombre', 'Error de conexión', 'error'); });
  });

  function abrirModalPassword(p){
    idModalActivo = p.id;
    document.getElementById('modalPasswordDesc').textContent = 'Nuevo password para: ' + p.nombre;
    document.getElementById('modalPasswordInput').value = '';
    document.getElementById('modalPassword').classList.add('visible');
  }
  document.getElementById('btnCancelarPassword').addEventListener('click', function(){
    document.getElementById('modalPassword').classList.remove('visible');
  });
  document.getElementById('btnGuardarPassword').addEventListener('click', function(){
    var pw = document.getElementById('modalPasswordInput').value.trim();
    if (pw.length < 8){ mostrarMensaje('mensajeModalPassword', 'Mínimo 8 caracteres', 'error'); return; }
    apiPostAdmin(URL_ADMIN_PASSWORD, {id: idModalActivo, nuevoPassword: pw}).then(function(data){
      if (manejarNoAutorizado(data)) return;
      if (!data.ok){ mostrarMensaje('mensajeModalPassword', data.error || 'Error', 'error'); return; }
      document.getElementById('modalPassword').classList.remove('visible');
      limpiarMensaje('mensajeModalPassword');
      toast('Password actualizado', 'ok');
    }).catch(function(){ mostrarMensaje('mensajeModalPassword', 'Error de conexión', 'error'); });
  });

  function abrirModalBorrar(p){
    idModalActivo = p.id;
    document.getElementById('modalBorrarDesc').innerHTML =
      'Eliminar a <strong>' + p.nombre + '</strong> de esta quiniela. Se borran también sus pronósticos y sesiones activas. No se puede deshacer.';
    document.getElementById('modalBorrar').classList.add('visible');
  }
  document.getElementById('btnCancelarBorrar').addEventListener('click', function(){
    document.getElementById('modalBorrar').classList.remove('visible');
  });
  document.getElementById('btnConfirmarBorrar').addEventListener('click', function(){
    apiPostAdmin(URL_ADMIN_BORRAR, {id: idModalActivo}).then(function(data){
      if (manejarNoAutorizado(data)) return;
      if (!data.ok){ mostrarMensaje('mensajeModalBorrar', data.error || 'Error', 'error'); return; }
      participantes = participantes.filter(function(p){ return p.id !== idModalActivo; });
      document.getElementById('modalBorrar').classList.remove('visible');
      limpiarMensaje('mensajeModalBorrar');
      renderParticipantes();
      toast('Participante eliminado', 'ok');
    }).catch(function(){ mostrarMensaje('mensajeModalBorrar', 'Error de conexión', 'error'); });
  });

  document.querySelectorAll('.modal-overlay').forEach(function(m){
    m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('visible'); });
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay').forEach(function(m){ m.classList.remove('visible'); });
  });

})();
</script>
</body>
</html>
